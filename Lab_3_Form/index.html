<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

    body {
      font-family: "Inter", Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .choice-label {
      border: 1px solid #dbe3ef;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .choice-label:hover,
    .choice-label.selected {
      border-color: rgba(37, 99, 235, 0.45);
      background: #eff6ff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="mx-auto grid min-h-screen max-w-6xl items-center gap-8 px-5 py-10 lg:grid-cols-[0.9fr_1.1fr]">
    <section>
      <p class="text-sm font-bold uppercase tracking-[0.2em] text-blue-700">Lab 3</p>
      <h1 class="mt-3 text-4xl font-extrabold tracking-tight text-slate-950">Student registration</h1>
      <p class="mt-4 max-w-xl leading-8 text-slate-600">
        Semantic form elements, JavaScript value capture, checkbox handling, and a styled output summary for the Education Management System domain.
      </p>
    </section>

    <section class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-sm">
      <form id="studentForm" class="space-y-5">
        <header>
          <h2 class="text-2xl font-extrabold">Registration details</h2>
          <p class="mt-2 text-sm text-slate-500">Enter sample values and submit to generate the output box.</p>
        </header>

        <div>
          <label for="name" class="mb-2 block text-sm font-bold text-slate-700">Full name</label>
          <input type="text" id="name" name="name" required placeholder="Raju Kumar" class="w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        </div>

        <div>
          <label for="email" class="mb-2 block text-sm font-bold text-slate-700">Email</label>
          <input type="email" id="email" name="email" required placeholder="raju@example.com" class="w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
        </div>

        <div>
          <label for="course" class="mb-2 block text-sm font-bold text-slate-700">Course</label>
          <select id="course" name="course" class="w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
            <option value="MCA">MCA</option>
            <option value="BCA">BCA</option>
            <option value="BSc Computer Science">BSc Computer Science</option>
          </select>
        </div>

        <fieldset>
          <legend class="mb-3 text-sm font-bold text-slate-700">Preferred learning mode</legend>
          <div class="grid gap-3 sm:grid-cols-2">
            <label class="choice-label flex cursor-pointer items-center gap-3 rounded-2xl px-4 py-3">
              <input type="radio" name="mode" value="Online" class="h-4 w-4 accent-blue-600" checked>
              Online
            </label>
            <label class="choice-label flex cursor-pointer items-center gap-3 rounded-2xl px-4 py-3">
              <input type="radio" name="mode" value="Offline" class="h-4 w-4 accent-blue-600">
              Offline
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend class="mb-3 text-sm font-bold text-slate-700">Skills</legend>
          <div class="grid gap-3 sm:grid-cols-3">
            <label class="choice-label flex cursor-pointer items-center gap-3 rounded-2xl px-4 py-3">
              <input type="checkbox" name="skills" value="AI" class="h-4 w-4 accent-blue-600">
              AI
            </label>
            <label class="choice-label flex cursor-pointer items-center gap-3 rounded-2xl px-4 py-3">
              <input type="checkbox" name="skills" value="Cloud" class="h-4 w-4 accent-blue-600">
              Cloud
            </label>
            <label class="choice-label flex cursor-pointer items-center gap-3 rounded-2xl px-4 py-3">
              <input type="checkbox" name="skills" value="Web" class="h-4 w-4 accent-blue-600">
              Web
            </label>
          </div>
        </fieldset>

        <button class="w-full rounded-full bg-blue-600 px-5 py-3 font-bold text-white transition hover:bg-blue-700" type="submit">Submit form</button>
      </form>

      <div id="output" class="mt-6"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("studentForm");

    function updateSelectedLabels() {
      document.querySelectorAll(".choice-label").forEach(label => {
        const input = label.querySelector("input");
        label.classList.toggle("selected", input.checked);
      });
    }

    form.addEventListener("change", updateSelectedLabels);
    updateSelectedLabels();

    form.addEventListener("submit", event => {
      event.preventDefault();

      const name = document.querySelector("#name").value.trim();
      const email = document.querySelector("#email").value.trim();
      const course = document.querySelector("#course").value;
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const skills = Array.from(document.querySelectorAll('input[name="skills"]:checked')).map(skill => skill.value);

      document.getElementById("output").innerHTML = `
        <section class="rounded-3xl border border-blue-100 bg-blue-50 p-5">
          <h2 class="text-xl font-extrabold text-slate-950">Submitted Details</h2>
          <dl class="mt-4 grid gap-3 text-sm text-slate-700 sm:grid-cols-2">
            <div><dt class="font-bold text-slate-900">Name</dt><dd>${name}</dd></div>
            <div><dt class="font-bold text-slate-900">Email</dt><dd>${email}</dd></div>
            <div><dt class="font-bold text-slate-900">Course</dt><dd>${course}</dd></div>
            <div><dt class="font-bold text-slate-900">Mode</dt><dd>${mode}</dd></div>
            <div class="sm:col-span-2"><dt class="font-bold text-slate-900">Skills</dt><dd>${skills.length ? skills.join(", ") : "No skills selected"}</dd></div>
          </dl>
        </section>
      `;
    });
  </script>
</body>
</html>
