<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduManage | Home</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="site-header">
    <nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-5 py-4">
      <a href="index.html" class="flex items-center gap-3 font-extrabold tracking-tight text-slate-900">
        <span class="grid h-10 w-10 place-items-center rounded-2xl bg-blue-600 text-white">
          <i class="fa-solid fa-graduation-cap"></i>
        </span>
        <span>EduManage</span>
      </a>
      <div class="flex items-center gap-1">
        <a class="nav-link active" href="index.html">Home</a>
        <a class="nav-link" href="courses.html">Courses</a>
        <a class="nav-link" href="dashboard.html">Dashboard</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="mx-auto grid min-h-[calc(100svh-73px)] max-w-6xl items-center gap-10 px-5 py-12 lg:grid-cols-[1.05fr_0.95fr]">
      <div class="fade-in">
        <p class="mb-4 text-sm font-bold uppercase tracking-[0.2em] text-blue-700">Education Management System</p>
        <h1 class="max-w-3xl text-4xl font-extrabold leading-tight tracking-tight text-slate-950 sm:text-5xl">
          A responsive academic portal for students and courses.
        </h1>
        <p class="mt-5 max-w-2xl text-lg leading-8 text-slate-600">
          Lab 2 demonstrates responsive layouts, navigation, icons, SVG, canvas, modal interactions, and custom CSS refinements.
        </p>
        <div class="mt-8 flex flex-wrap gap-3">
          <a class="primary-button px-5 py-3" href="courses.html">View Courses</a>
          <a class="ghost-button px-5 py-3" href="dashboard.html">Open Dashboard</a>
        </div>
        <dl class="metric mt-10 grid max-w-xl grid-cols-3 gap-5 pt-6">
          <div>
            <dt class="text-sm text-slate-500">Pages</dt>
            <dd class="text-2xl font-extrabold">3</dd>
          </div>
          <div>
            <dt class="text-sm text-slate-500">Layout</dt>
            <dd class="text-2xl font-extrabold">Grid</dd>
          </div>
          <div>
            <dt class="text-sm text-slate-500">Mode</dt>
            <dd class="text-2xl font-extrabold">RWD</dd>
          </div>
        </dl>
      </div>

      <div class="hero-panel fade-in rounded-[2rem] p-6">
        <svg viewBox="0 0 520 360" role="img" aria-label="Academic dashboard illustration" class="h-auto w-full">
          <rect width="520" height="360" rx="32" fill="#f8fafc"/>
          <rect x="42" y="48" width="436" height="264" rx="24" fill="#fff" stroke="#dbe3ef" stroke-width="2"/>
          <rect x="72" y="82" width="170" height="24" rx="12" fill="#172033"/>
          <rect x="72" y="126" width="376" height="14" rx="7" fill="#dbeafe"/>
          <rect x="72" y="160" width="120" height="92" rx="18" fill="#eff6ff"/>
          <rect x="216" y="160" width="120" height="92" rx="18" fill="#ecfdf5"/>
          <rect x="360" y="160" width="88" height="92" rx="18" fill="#f8fafc" stroke="#dbe3ef"/>
          <circle cx="132" cy="202" r="26" fill="#2563eb"/>
          <path d="M121 203l8 8 18-22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="236" y="188" width="80" height="12" rx="6" fill="#16a34a"/>
          <rect x="236" y="211" width="54" height="12" rx="6" fill="#bbf7d0"/>
          <path d="M382 222c20-44 38-44 52 0" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
          <rect x="72" y="278" width="376" height="8" rx="4" fill="#e2e8f0"/>
        </svg>
        <canvas id="progressCanvas" width="520" height="140" class="mt-5 w-full rounded-3xl border border-slate-200 bg-white"></canvas>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("progressCanvas");
    const ctx = canvas.getContext("2d");
    const bars = [84, 68, 92, 76, 88];
    ctx.font = "600 14px Inter, Arial";
    ctx.fillStyle = "#64748b";
    ctx.fillText("Canvas: weekly learning progress", 24, 28);
    bars.forEach((value, index) => {
      const x = 28 + index * 94;
      const height = value * 0.8;
      ctx.fillStyle = "#dbeafe";
      ctx.fillRect(x, 44, 48, 76);
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(x, 120 - height, 48, height);
    });
  </script>
</body>
</html>
