<!DOCTYPE html>
<html>
<head>
  <title>Courses</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <h1 class="text-3xl font-bold mb-6">Courses</h1>

  <div class="grid md:grid-cols-3 gap-6">
    <div class="bg-white p-4 rounded shadow hover:scale-105 transition">
      <h2 class="text-xl font-bold">Web Development</h2>
      <button onclick="openModal()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded">View</button>
    </div>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded">
      <h2 class="text-2xl font-bold">Course Details</h2>
      <p>Introduction to Full Stack Development</p>
      <button onclick="closeModal()" class="mt-4 bg-red-500 text-white px-4 py-2 rounded">Close</button>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById("modal").classList.remove("hidden");
    }
    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
    }
  </script>
</body>
</html>
