<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Explorer</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #64748b;
      --line: #dbe3ef;
      --accent: #2563eb;
    }

    body.dark {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #172033;
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --line: #334155;
      --accent: #60a5fa;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      transition: background 160ms ease, color 160ms ease;
    }

    .control,
    .course-card {
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .course-card {
      cursor: grab;
      transition: transform 160ms ease, border-color 160ms ease, opacity 160ms ease;
    }

    .course-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .course-card.dragging {
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <main class="mx-auto max-w-6xl px-5 py-10">
    <header class="mb-8 flex flex-col justify-between gap-5 md:flex-row md:items-end">
      <div>
        <p class="text-sm font-bold uppercase tracking-[0.2em] text-blue-600">Lab 4</p>
        <h1 class="mt-3 text-4xl font-extrabold tracking-tight">Course Explorer</h1>
        <p class="mt-3 max-w-2xl leading-7" style="color: var(--muted)">Fetch API, search, filter, localStorage theme, service worker cache, and drag-and-drop reordering.</p>
      </div>
      <button id="themeToggle" class="control rounded-full px-5 py-3 text-sm font-bold">Switch Theme</button>
    </header>

    <section class="control mb-6 grid gap-4 rounded-[2rem] p-4 md:grid-cols-[1fr_220px]">
      <label>
        <span class="mb-2 block text-sm font-bold">Search courses</span>
        <input type="text" id="search" placeholder="Search by title or department" class="control w-full rounded-2xl px-4 py-3 outline-none focus:ring-4 focus:ring-blue-100">
      </label>
      <label>
        <span class="mb-2 block text-sm font-bold">Department</span>
        <select id="departmentFilter" class="control w-full rounded-2xl px-4 py-3 outline-none focus:ring-4 focus:ring-blue-100">
          <option value="All">All departments</option>
        </select>
      </label>
    </section>

    <p id="status" class="mb-4 text-sm font-semibold" style="color: var(--muted)">Loading courses...</p>
    <section id="courses" class="grid gap-4 md:grid-cols-2"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
